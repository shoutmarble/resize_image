name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: wasmffmpeg-gui
            exe: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: wasmffmpeg-gui.exe
            exe: ".exe"
          # Both macOS architectures build on Apple Silicon runners: the
          # Xcode SDK targets both, no Intel runner needed.
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: wasmffmpeg-gui
            exe: ""
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bin: wasmffmpeg-gui
            exe: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p wasmffmpeg-gui --target ${{ matrix.target }}

      - name: Stage the raw binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
             "dist/wasmffmpeg-gui-${{ github.ref_name }}-${{ matrix.name }}${{ matrix.exe }}"

      - name: Upload binaries to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
