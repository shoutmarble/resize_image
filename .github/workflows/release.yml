name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: wasmffmpeg-gui
            pkg: tar
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: wasmffmpeg-gui.exe
            pkg: zip
          # Both macOS architectures build on Apple Silicon runners: the
          # Xcode SDK targets both, no Intel runner needed.
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: wasmffmpeg-gui
            pkg: tar
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bin: wasmffmpeg-gui
            pkg: tar
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p wasmffmpeg-gui --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.pkg == 'tar'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/wasmffmpeg-gui-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" "${{ matrix.bin }}" \
            -C "$GITHUB_WORKSPACE" README.md

      - name: Package (zip)
        if: matrix.pkg == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}", "README.md" `
            -DestinationPath "dist/wasmffmpeg-gui-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Upload binaries to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
