[package]
name = "wasmffmpeg-gui"
edition.workspace = true
license.workspace = true

[dependencies]
wasmffmpeg-core = { path = "../core" }
iced = { version = "0.14", features = ["sipper"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
futures = "0.3"
sipper = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
